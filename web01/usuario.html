<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Usuários - LAB03</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-destaque fw-bold" href="index.html">HOME</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="academico.html">Módulo Acadêmico</a></li>
                    <li class="nav-item"><a class="nav-link active" href="usuario.html">Módulo de Alunos</a></li>
                    <li class="nav-item"><a class="nav-link" href="financeiro.html">Módulo Financeiro</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Portal do Aluno</h2>
        
        <div class="row">
            <!-- Cadastro e Login -->
            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h4>Cadastrar Aluno</h4>
                    <form id="formUsuario">
                        <div class="mb-3">
                            <label>Nome Completo *</label>
                            <input type="text" id="usuNome" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>E-mail *</label>
                            <input type="email" id="usuEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Senha *</label>
                            <input type="password" id="usuSenha" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Registrar</button>
                    </form>
                </div>

                <div class="card p-3 mb-3">
                    <h4>Simular Login</h4>
                    <select id="selectLogin" class="form-control mb-3"></select>
                    <button class="btn btn-secondary w-100" onclick="btnEntrar()">Entrar / Atualizar Tela</button>
                    <hr>
                    <p><strong>Usuário Atual:</strong> <span id="lblUsuLogado">Nenhum</span></p>
                </div>
            </div>

            <!-- Dashboard do Aluno logado -->
            <div class="col-md-8">
                <div id="areaLogada" style="display:none;">
                    
                    <div class="card p-3 mb-3 border-danger">
                        <h4>Fazer Nova Matrícula</h4>
                        <div class="d-flex">
                            <select id="selectCursoMatricula" class="form-control me-2"></select>
                            <button class="btn btn-primary" onclick="btnMatricular()">Matricular</button>
                        </div>
                    </div>

                    <div class="card p-3">
                        <h4>Meus Cursos e Progresso</h4>
                        <div id="listaMeusCursos" class="accordion mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Certificado -->
    <div class="modal fade" id="modalCertificado" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content text-center">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title">Certificado de Conclusão</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-5 border">
            <h2>CERTIFICADO</h2>
            <br>
            <p>Certificamos que <strong><span id="certNome"></span></strong></p>
            <p>Concluiu o curso de <strong><span id="certCurso"></span></strong>.</p>
            <br>
            <p>Código de Verificação: <span class="text-destaque fw-bold" id="certCodigo"></span></p>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/modelos.js"></script>
    <script src="./js/bancoDados.js"></script>
    <script src="./js/usuario.js"></script>
</body>
</html>
