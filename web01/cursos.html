<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma de Cursos - Gestão e Visualização</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/estilo.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="./img/school.svg" alt="Logo" class="d-inline-block align-text-top" />
                DevTech
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="./cursos.html">Cursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="./trilhas.html">Trilhas</a></li>
                    <li class="nav-item"><a class="nav-link" href="./projetos.html">Projetos</a></li>
                    <li class="nav-item"><a class="nav-link" href="./sobre.html">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="./contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Gestão Acadêmica e Cursos Disponíveis</h2>
        <hr />

        <div class="accordion mb-5" id="accordionCadastro">
            
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingCat">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCat">
                        1. Gerenciar Categorias
                    </button>
                </h2>
                <div id="collapseCat" class="accordion-collapse collapse" data-bs-parent="#accordionCadastro">
                    <div class="accordion-body">
                        <form id="formCategoria" class="row gx-2 py-2">
                            <div class="col-md-5">
                                <label>Nome da Categoria *</label>
                                <input type="text" id="catNome" class="form-control" required>
                            </div>
                            <div class="col-md-5">
                                <label>Descrição</label>
                                <input type="text" id="catDesc" class="form-control">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header" id="headingCur">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCur">
                        2. Cadastrar Cursos
                    </button>
                </h2>
                <div id="collapseCur" class="accordion-collapse collapse" data-bs-parent="#accordionCadastro">
                    <div class="accordion-body">
                        <form id="formCurso" class="row gx-2 py-2">
                            <div class="col-md-4 mb-2">
                                <label>Título do Curso *</label>
                                <input type="text" id="curTitulo" class="form-control" required>
                            </div>
                            <div class="col-md-3 mb-2">
                                <label>Categoria *</label>
                                <select id="curCategoria" class="form-select" required></select>
                            </div>
                            <div class="col-md-3 mb-2">
                                <label>Nível *</label>
                                <select id="curNivel" class="form-select" required>
                                    <option>Iniciante</option>
                                    <option>Intermediário</option>
                                    <option>Avançado</option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-2 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100">Salvar Curso</button>
                            </div>
                            <div class="col-12 mt-2">
                                <label>Descrição do Curso</label>
                                <textarea id="curDesc" class="form-control" rows="2"></textarea>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header" id="headingAula">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAula">
                        3. Estrutura de Módulos e Aulas
                    </button>
                </h2>
                <div id="collapseAula" class="accordion-collapse collapse" data-bs-parent="#accordionCadastro">
                    <div class="accordion-body">
                        <h5>A. Adicionar Módulo</h5>
                        <form id="formModulo" class="row gx-2 mb-4">
                            <div class="col-md-5">
                                <label>Curso *</label>
                                <select id="modCurso" class="form-select" required></select>
                            </div>
                            <div class="col-md-4">
                                <label>Título do Módulo *</label>
                                <input type="text" id="modTitulo" class="form-control" required>
                            </div>
                            <div class="col-md-2">
                                <label>Ordem *</label>
                                <input type="number" id="modOrdem" class="form-control" required min="1">
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button type="submit" class="btn btn-secondary w-100">+</button>
                            </div>
                        </form>
                        <hr>
                        <h5>B. Adicionar Aula</h5>
                        <form id="formAula" class="row gx-2">
                            <div class="col-md-4">
                                <label>Módulo *</label>
                                <select id="aulaModulo" class="form-select" onmouseenter="carregarModulosSelects()" required></select>
                            </div>
                            <div class="col-md-4">
                                <label>Título da Aula *</label>
                                <input type="text" id="aulaTitulo" class="form-control" required>
                            </div>
                            <div class="col-md-2">
                                <label>Duração (Min)</label>
                                <input type="number" id="aulaDuracao" class="form-control" min="1" value="10">
                            </div>
                            <div class="col-md-1">
                                <label>Ordem *</label>
                                <input type="number" id="aulaOrdem" class="form-control" required min="1">
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button type="submit" class="btn btn-secondary w-100">+</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Catálogo de Cursos</h4>
            <div class="w-25">
                <select id="filtroCursoCategoria" class="form-select" onchange="btnFiltrarCursos()">
                    <option value="">Todas as Categorias</option>
                </select>
            </div>
        </div>
        
        <div class="row g-4" id="listaCursosContainer">
        </div>

    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/bancoDados.js"></script>
    
    <script src="./js/models/Modelos.js"></script>
    <script src="./js/services/CursoService.js"></script>
    <script src="./js/controllers/CursoController.js"></script>
</body>
</html>
