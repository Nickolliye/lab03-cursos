<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Financeiro - LAB03</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-destaque fw-bold" href="index.html">HOME</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="academico.html">Módulo Acadêmico</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuario.html">Módulo de Alunos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="financeiro.html">Módulo Financeiro</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Assinaturas e Pagamentos</h2>

        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card p-4 shadow-sm border-dark">
                    <h4 class="mb-3">Checkout de Planos</h4>
                    
                    <form id="formCheckout">
                        <!-- Identificacao -->
                        <div class="mb-3">
                            <label>Quem está assinando? * (Simulador de Sessão)</label>
                            <select id="checkoutUsuario" class="form-control" required></select>
                        </div>
                        
                        <!-- Selecao de Plano -->
                        <div class="mb-3">
                            <label>Selecione seu Plano *</label>
                            <select id="checkoutPlano" class="form-control" required onchange="renderizarPreco()"></select>
                        </div>
                        
                        <div class="alert alert-danger" role="alert">
                            <strong>Total a Pagar: </strong> R$ <span id="checkoutValor">0,00</span>
                        </div>

                        <!-- Pagamento -->
                        <h5 class="mt-4">Dados de Pagamento</h5>
                        <div class="mb-3">
                            <label>Método de Pagamento *</label>
                            <select id="checkoutMetodo" class="form-control" required>
                                <option value="">-- Escolha --</option>
                                <option value="Boleto">Boleto Bancário</option>
                                <option value="Pix">Pix</option>
                                <option value="Cartão de Crédito">Cartão de Crédito</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label>Nome no Cartão (opicional)</label>
                            <input type="text" class="form-control" placeholder="Apenas se for cartão">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg mt-3">Finalizar Pagamento</button>
                    </form>
                </div>
                
                <!-- Recibo Final -->
                <div class="card p-4 mt-3 border-success text-center" id="cardRecibo" style="display:none;">
                    <h3 class="text-success">Pagamento Confirmado!</h3>
                    <p class="mt-3">A assinatura foi ativada com sucesso na sua conta.</p>
                    <hr>
                    <p><strong>ID da Transação:</strong> <span id="reciboTrx"></span></p>
                    <p><strong>Método Utilizado:</strong> <span id="reciboMetodo"></span></p>
                    <p><strong>Valor Pago:</strong> R$ <span id="reciboValor"></span></p>
                </div>

            </div>
        </div>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/modelos.js"></script>
    <script src="./js/bancoDados.js"></script>
    <script src="./js/financeiro.js"></script>
</body>
</html>
